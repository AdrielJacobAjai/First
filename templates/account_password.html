{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px;margin:1rem auto">
  <h2 style="margin-top:0">Change password</h2>
  {% if current_user.must_change %}<div class="notice">You must choose a new password before continuing.</div>{% endif %}
  {% if error %}<div class="notice" role="alert" style="border-color:#b3261e;margin-top:.6rem">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Current password</label><input name="current" type="password" required autocomplete="current-password">
    <label>New password (10+ characters, letters and numbers)</label><input name="new" type="password" required autocomplete="new-password">
    <label>New password again</label><input name="again" type="password" required autocomplete="new-password">
    <button type="submit" style="margin-top:1rem">Change password</button>
  </form>
</div>
{% endblock %}
